# Local Airflow: one Postgres metadata DB + `airflow standalone`
# (API server/UI, scheduler, DAG processor and triggerer in one container).
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
  # Local only: no login screen. Never use this on a shared deployment.
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
  DATA_DIR: /opt/airflow/data
  DUCKDB_PATH: /opt/airflow/data/warehouse.duckdb
  DBT_PROJECT_DIR: /opt/airflow/dbt

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow:
    build: .
    command: standalone
    # Run as your host user so files written to ./data and ./dbt stay yours.
    user: "${AIRFLOW_UID:-50000}:0"
    env_file: .env
    environment: *airflow-env
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./dbt:/opt/airflow/dbt
      - ./data:/opt/airflow/data
      - ./secrets:/opt/airflow/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
