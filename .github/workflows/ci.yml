name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests dags
      - run: pytest -q

  dbt:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      DBT_TARGET: duckdb
      DUCKDB_PATH: ${{ github.workspace }}/data/warehouse.duckdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt
      - run: pip install -r requirements-dev.txt
      - name: Load sample month into DuckDB
        run: python -m taxi_elt.cli --target duckdb --month 2021-01 --file data/sample/yellow_tripdata_2021-01_sample.parquet
      - name: dbt build (models, unit tests, data tests)
        working-directory: dbt
        run: dbt build --profiles-dir . --target duckdb
      - name: Re-run the month incrementally (must be idempotent)
        working-directory: dbt
        run: |
          dbt build --profiles-dir . --target duckdb --vars '{"month": "2021-01-01"}' --select fct_trips+

  dag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DAG imports cleanly in the Airflow image
        run: |
          docker build -t nyc-taxi-airflow .
          docker run --rm -v "$PWD/dags:/opt/airflow/dags" -v "$PWD/src:/opt/airflow/src" \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=False nyc-taxi-airflow bash -c \
            "airflow db migrate > /dev/null && airflow dags reserialize && airflow dags list-import-errors && airflow dags list -o plain | grep nyc_taxi_elt"
