[project]
name = "taxi-elt"
version = "0.1.0"
description = "Extract/load step of the NYC taxi ELT pipeline"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "duckdb>=1.1", "pyarrow>=15"]

[project.optional-dependencies]
bigquery = ["google-cloud-bigquery>=3.20", "google-cloud-storage>=2.16"]
dev = ["pytest>=8", "ruff>=0.6", "dbt-core>=1.10,<2", "dbt-duckdb>=1.10,<2", "dbt-bigquery>=1.10,<2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
